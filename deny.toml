# cargo-deny policy (docs/security-review.md, "Supply chain").
# Run: cargo deny check

[graph]
all-features = false

[advisories]
# unmaintained/unsound crates are reported; the ones below are reviewed in
# docs/security-review.md and only reachable from the first-boot TUI (ratatui)
ignore = [
    { id = "RUSTSEC-2023-0089", reason = "atomic-polyfill via postcard/heapless; no replacement upstream yet, no known vulnerability" },
]

[licenses]
# AGPL-3.0-only project: permissive + weak copyleft licenses only
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "BSL-1.0",
    "0BSD",
    "AGPL-3.0-only",
    "OpenSSL",
]
confidence-threshold = 0.8

[[licenses.clarify]]
crate = "ring"
expression = "ISC AND MIT AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "allow"
# internal path dependencies (workspace crates) carry no version
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
