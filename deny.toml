# cargo-deny policy (docs/security-review.md, "Supply chain").
# Run: cargo deny check

[graph]
all-features = false

[advisories]
# unmaintained/unsound crates are reported; the ones below are reviewed in
# docs/security-review.md and only reachable from the first-boot TUI (ratatui)
ignore = [
    # ttf-parser unmaintained (via iced/cosmic-text/fontdb): only in nexus-agent-gui, parses
    # the fonts installed on the desktop (no untrusted input); docs/security-review.md
    "RUSTSEC-2026-0192",
    # lru 0.16 unsound (pop with a panicking key Drop): in Cargo.lock only, through cryoglyph in iced_wgpu, which
    # is never built (software renderer; Cargo locks optional dependencies named by weak `dep?/feature`
    # features); the appliance's file index uses lru 0.18.5 through tantivy 0.27
    "RUSTSEC-2026-0253",
]

[licenses]
# AGPL-3.0-only project: permissive + weak copyleft licenses only
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "BSL-1.0",
    "0BSD",
    "AGPL-3.0-only",
    "OpenSSL",
    # ksni (tray icon on Linux, nexus-agent-gui): public-domain dedication
    "Unlicense",
]
confidence-threshold = 0.8

[[licenses.clarify]]
crate = "ring"
expression = "ISC AND MIT AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "allow"
# internal path dependencies (workspace crates) carry no version
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
