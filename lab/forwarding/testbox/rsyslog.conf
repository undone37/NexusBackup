# Lab receiver: syslog over TLS on 6514 (RFC 5425; octet-counted framing is imtcp's default),
# every message in RFC 5424 form (structured data included) to /out/syslog.log.
global(
  workDirectory="/tmp"
  DefaultNetstreamDriver="gtls"
  DefaultNetstreamDriverCAFile="/certs/ca.crt"
  DefaultNetstreamDriverCertFile="/certs/tls.crt"
  DefaultNetstreamDriverKeyFile="/certs/tls.key"
)
module(load="imtcp" StreamDriver.Name="gtls" StreamDriver.Mode="1" StreamDriver.AuthMode="anon")
input(type="imtcp" port="6514")
action(type="omfile" file="/out/syslog.log" template="RSYSLOG_SyslogProtocol23Format")
