# LAB ONLY (Containerfile.update-lab): the test registry on the dev host, plain HTTP.
# The VM resolves nexus-lab-registry to 10.0.2.2 through /etc/hosts (set at runtime by
# update-lab.sh vm-prep; podman build does not keep /etc/hosts edits). A registries.conf
# location remap (prefix nexus-lab-registry:5055 -> location 10.0.2.2:5055) pulls the
# image but containers/image then finds no sigstore attachment ("A signature was
# required, but no signature exists"), so the name must resolve directly.
[[registry]]
location = "nexus-lab-registry:5055"
insecure = true
