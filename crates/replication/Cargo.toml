[package]
name = "replication"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# docs/replication.md. Without default features only the protocol types (used
# by nexus-web-api, which must never touch stores or keys); `daemons` adds
# nexus-replicad (primary, serves sealed objects read-only) and nexus-replica
# (secondary, enrollment + pull sync).
[features]
default = ["daemons"]
daemons = [
  "dep:anyhow", "dep:catalog", "dep:chunkstore", "dep:keyd", "dep:libc", "dep:pem", "dep:rcgen",
  "dep:rustls", "dep:time", "dep:tls-pq", "dep:x509-parser",
]

[dependencies]
tls-pq = { path = "../tls-pq", optional = true }
agent-proto = { path = "../agent-proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
anyhow = { version = "1", optional = true }
catalog = { path = "../catalog", optional = true }
chunkstore = { path = "../chunkstore", optional = true }
keyd = { path = "../keyd", optional = true }
libc = { version = "0.2", optional = true }
pem = { version = "3", optional = true }
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring", "x509-parser"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"], optional = true }
time = { version = "0.3", optional = true }
x509-parser = { version = "0.16", features = ["verify"], optional = true }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "nexus-replicad"
path = "src/bin/nexus-replicad.rs"
required-features = ["daemons"]

[[bin]]
name = "nexus-replica"
path = "src/bin/nexus-replica.rs"
required-features = ["daemons"]

[lints]
workspace = true
