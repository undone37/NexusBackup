[package]
name = "fsindex"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "nexus-fsindex: read-only, sandboxed guest file system lister for VM disk images (Phase 31a)"

[dependencies]
ext4-view = "1"
fatfs = { version = "0.3", default-features = false, features = ["std", "alloc"] }
libc = "0.2"
ntfs = "0.4"
seccompiler = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[[bin]]
name = "nexus-fsindex"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
