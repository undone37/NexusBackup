[package]
name = "web-api"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
build = "build.rs"

[[bin]]
name = "nexus-web-api"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "json", "query", "tokio"] }
agent-proto = { path = "../agent-proto" }
catalog = { path = "../catalog" }
hyper = "1"
hyper-util = { version = "0.1", features = ["server-auto", "tokio", "http1", "http2", "service"] }
rand = "0.8"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "signal", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = { version = "0.5", features = ["util"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
