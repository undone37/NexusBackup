[package]
name = "web-api"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
build = "build.rs"

[[bin]]
name = "nexus-web-api"
path = "src/main.rs"

[dependencies]
tls-pq = { path = "../tls-pq" }
# the written form of recovery keys (parse and checksum; not keyd, see tests/replication.rs)
recovery-key = { path = "../recovery-key" }
anyhow = "1"
base64 = "0.22"
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "json", "query", "tokio"] }
agent-proto = { path = "../agent-proto" }
# file filter validation exactly as the agents compile them (regex size limits)
agent-core = { path = "../agent-core" }
catalog = { path = "../catalog" }
index-proto = { path = "../index-proto" }
# web certificate: Settings → Certificate parsing, requests to nexus-tls
webtls = { path = "../webtls" }
nas = { path = "../nas", default-features = false }
plugin-manager = { path = "../plugin-manager" }
plugin-proto = { path = "../plugin-proto", features = ["bundle"] }
reports = { path = "../reports" }
# restore point simulator: the GFS rule retention runs (`retention::keep`; not the store)
retention = { path = "../retention" }
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode"] }
# protocol types only (no chunk store, no keyd): docs/replication.md §2
repl_proto = { package = "replication", path = "../replication", default-features = false }
truenas = { path = "../truenas", default-features = false }
vmware = { path = "../vmware", default-features = false }
xcpng = { path = "../xcpng", default-features = false }
hyper = "1"
hyper-util = { version = "0.1", features = ["server-auto", "tokio", "http1", "http2", "service"] }
rand = "0.8"
# OIDC: discovery, JWKS and token requests to the IdP (rustls, no redirects)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
# OIDC: ID token signatures (RS256 / PS256 / ES256)
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "signal", "time", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = { version = "0.5", features = ["util"] }
# agent release uploads (Phase 27): streamed body, tar extraction
http-body-util = "0.1"
tar = "0.4"

[dev-dependencies]
plugin-manager = { path = "../plugin-manager" }
http-body-util = "0.1"
tempfile = "3"
# tests/replication.rs: two appliances in one process (primary: replicad + keyd +
# scheduler; secondary: the nexus-replica client library + keyd)
repl_proto = { package = "replication", path = "../replication" }
chunkstore = { path = "../chunkstore" }
keyd = { path = "../keyd" }
scheduler = { path = "../scheduler" }
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring"] }
libc = "0.2"

[lints]
workspace = true
