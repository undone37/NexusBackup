[package]
name = "web-api-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "AGPL-3.0-only"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
web-api = { path = ".." }
catalog = { path = "../../catalog" }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
tokio = { version = "1", features = ["rt"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
serde_json = "1"
tempfile = "3"

[workspace]
members = ["."]

[[bin]]
name = "validators"
path = "fuzz_targets/validators.rs"
test = false
doc = false
bench = false

[[bin]]
name = "api_router"
path = "fuzz_targets/api_router.rs"
test = false
doc = false
bench = false
