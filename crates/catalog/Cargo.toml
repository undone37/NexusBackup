[package]
name = "catalog"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1"
argon2 = "0.5"
base64 = "0.22"
chacha20poly1305 = "0.10"
crypto_box = { version = "0.9", features = ["seal"] }
# Phase 30: the ML-KEM-768 half of a tenant recovery key (same derivation as keyd::hybrid)
blake3 = "1"
ml-kem = "0.3"
# the written form (24 BIP39 words) of a new tenant recovery key
recovery-key = { path = "../recovery-key" }
rand = "0.8"
totp-rs = { version = "5", features = ["gen_secret", "otpauth"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zeroize = "1"
chrono-tz = { version = "0.10.4", default-features = false }
chrono = { version = "0.4", default-features = false }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
