[package]
name = "webtls"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Web certificate of the appliance: CSR, chain validation and install (nexus-tls, root oneshot)"

[[bin]]
name = "nexus-tls"
path = "src/main.rs"

[dependencies]
anyhow = "1"
libc = "0.2"
pem = "3"
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
x509-parser = { version = "0.16", features = ["verify"] }

[dev-dependencies]
tempfile = "3"
