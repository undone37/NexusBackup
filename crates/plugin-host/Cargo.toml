[package]
name = "plugin-host"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "nexus-pluginhost: trusted side of sandboxed plugins (docs/plugin-system.md)"

[dependencies]
agent-conn = { path = "../agent-conn" }
anyhow = "1"
chunkstore = { path = "../chunkstore" }
fastcdc = "3"
keyd = { path = "../keyd" }
libc = "0.2"
plugin-proto = { path = "../plugin-proto" }
rand = "0.8"
seccompiler = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }

[[bin]]
name = "nexus-pluginhost"
path = "src/main.rs"

# Hostile/scripted plugin for the host's own tests (docs/plugin-sdk.md "Testing").
# Never shipped (os/Containerfile copies named binaries only).
[[bin]]
name = "nexus-test-plugin"
path = "src/bin/test_plugin.rs"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
