[package]
name = "plugin-host-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "AGPL-3.0-only"

[package.metadata]
cargo-fuzz = true

[dependencies]
anyhow = "1"
chunkstore = { path = "../../chunkstore" }
libfuzzer-sys = "0.4"
plugin-host = { path = ".." }
plugin-proto = { path = "../../plugin-proto" }
serde_json = "1"
tempfile = "3"

[workspace]
members = ["."]

[[bin]]
name = "hostile_plugin"
path = "fuzz_targets/hostile_plugin.rs"
test = false
doc = false
bench = false
