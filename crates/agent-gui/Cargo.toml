[package]
name = "agent-gui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
# tray-icon 0.26 needs 1.90
rust-version = "1.90"
description = "NexusBackup desktop agent UI (nexus-agent-gui): tray icon + Control Panel for Windows and Linux desktops"

[[bin]]
name = "nexus-agent-gui"
path = "src/main.rs"

[lib]
name = "nexus_agent_gui"
path = "src/lib.rs"

[dependencies]
agent-ui-proto = { path = "../agent-ui-proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# software renderer only (no wgpu/GPU drivers); smol for time::every. No linux-theme-detection: its mundy is
# on zbus 5 (unmaintained, RUSTSEC-2026-0370..0372); src/sni.rs reads the portal setting instead
iced = { version = "0.14", default-features = false, features = ["tiny-skia", "crisp", "smol", "x11", "wayland", "canvas"] }
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }

[dev-dependencies]
# headless rendering for the manual screenshots (tests/screenshots.rs)
iced_test = "0.14"
png = "0.18"

# Linux: StatusNotifierItem, notifications and the dark-mode setting over D-Bus in pure Rust (src/sni.rs)
# instead of ksni and notify-rust, which are still on zbus 5
[target.'cfg(not(windows))'.dependencies]
zbus = { version = "6", default-features = false, features = ["default-rt", "service", "proxy"] }

[target.'cfg(windows)'.dependencies]
tray-icon = { version = "0.26", default-features = false }
notify-rust = { version = "4", default-features = false }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_Security", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }

[lints]
workspace = true
