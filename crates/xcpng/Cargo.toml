[package]
name = "xcpng"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "XCP-ng / XenServer connector (docs/xcpng-design.md, #40): XAPI over HTTPS, snapshot VDIs read over NBD/TLS"

[lints]
workspace = true

[dependencies]
agent-proto = { path = "../agent-proto" }
anyhow = "1"
base64 = "0.22"
chunkstore = { path = "../chunkstore" }
keyd = { path = "../keyd" }
nbd = { path = "../nbd" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# the pinned-certificate TLS verifier (XCP-ng's certificate is self-signed)
truenas = { path = "../truenas", default-features = false, features = ["client"] }

[[bin]]
name = "nexus-xcpng"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3"
sha2 = "0.10"
