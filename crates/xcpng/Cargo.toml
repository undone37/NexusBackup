[package]
name = "xcpng"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "XCP-ng / XenServer connector (docs/xcpng-design.md, #40): XAPI over HTTPS, snapshot VDIs read over NBD/TLS"

[lints]
workspace = true

[features]
# the connector (XAPI client, NBD reads, backup, CLI); without features only the snapshot names and their
# validation (web-api, scheduler, reports)
default = ["connector"]
connector = [
    "dep:agent-proto",
    "dep:anyhow",
    "dep:base64",
    "dep:chunkstore",
    "dep:keyd",
    "dep:nbd",
    "dep:reqwest",
    "dep:rustls",
    "dep:serde",
    "dep:serde_json",
    "dep:truenas",
]

[dependencies]
agent-proto = { path = "../agent-proto", optional = true }
anyhow = { version = "1", optional = true }
base64 = { version = "0.22", optional = true }
chunkstore = { path = "../chunkstore", optional = true }
keyd = { path = "../keyd", optional = true }
nbd = { path = "../nbd", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
# the pinned-certificate TLS verifier (XCP-ng's certificate is self-signed)
truenas = { path = "../truenas", default-features = false, features = ["client"], optional = true }

[[bin]]
name = "nexus-xcpng"
path = "src/main.rs"
required-features = ["connector"]

[dev-dependencies]
tempfile = "3"
sha2 = "0.10"
