[package]
name = "scheduler"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1"
base64 = "0.22"
catalog = { path = "../catalog" }
nas = { path = "../nas", default-features = false }
truenas = { path = "../truenas", default-features = false }
chunkstore = { path = "../chunkstore" }
# the appliance's own SSH keys (ed25519, OpenSSH format; src/sshkeys.rs)
ed25519-dalek = "3"
rand = "0.8"
sha2 = "0.10"
zeroize = "1"
keyd = { path = "../keyd" }
lettre = { version = "0.11", default-features = false, features = ["builder", "hostname", "smtp-transport", "rustls-tls"] }
libc = "0.2"
nftsync = { path = "../nftsync" }
plugin-manager = { path = "../plugin-manager" }
plugin-proto = { path = "../plugin-proto" }
replication = { path = "../replication", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
# forwarding (src/forward.rs): syslog over TLS, pinned / CA-verified TLS of the HTTPS sink
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "nexus-scheduler"
path = "src/main.rs"

[dev-dependencies]
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring"] }
tempfile = "3"
