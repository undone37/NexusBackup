[package]
name = "edge"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "NexusBackup edge proxy (nexus-edge): relays end-to-end TLS sessions between the appliance and roaming agents"

[[bin]]
name = "nexus-edge"
path = "src/main.rs"

[lib]
name = "nexus_edge"
path = "src/lib.rs"

[dependencies]
tls-pq = { path = "../tls-pq" }
agent-core = { path = "../agent-core" }
agent-proto = { path = "../agent-proto" }
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
sha2 = "0.10"
hex = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
x509-parser = "0.16"

[dev-dependencies]
agent-conn = { path = "../agent-conn" }
agent-linux = { path = "../agent-linux" }
chunkstore = { path = "../chunkstore" }
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring", "x509-parser"] }
tempfile = "3"

[lints]
workspace = true
