[package]
name = "plugin-ssh"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "SSH client for plugins (russh, pinned host key): commands with stdin and stdout streaming"

[dependencies]
anyhow = "1"
russh = { version = "0.65", default-features = false, features = ["ring"] }
russh-sftp = "3"
tokio = { version = "1", features = ["rt-multi-thread", "time", "net", "io-util"] }

[lints]
workspace = true
