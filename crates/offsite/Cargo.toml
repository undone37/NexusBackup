[package]
name = "offsite"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1"
chunkstore = { path = "../chunkstore" }
keyd = { path = "../keyd" }
serde_json = "1"
postcard = { version = "1", features = ["use-std"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
futures-util = "0.3"
russh = { version = "0.64", default-features = false, features = ["ring"] }
russh-sftp = "3"
tokio = { version = "1", features = ["rt-multi-thread", "time", "net"] }

[[bin]]
name = "nexus-offsite"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3"
