[package]
name = "vmware"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
agent-conn = { path = "../agent-conn" }
agent-proto = { path = "../agent-proto" }
anyhow = "1"
chunkstore = { path = "../chunkstore" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# the pinned-certificate TLS verifier (ESXi's certificate is self-signed; truenas::api::tls_config)
truenas = { path = "../truenas", default-features = false, features = ["client"] }

[dev-dependencies]
tempfile = "3"
