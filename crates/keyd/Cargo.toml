[package]
name = "keyd"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
blake3 = "1"
chacha20poly1305 = "0.11"
chunkstore = { path = "../chunkstore" }
crypto_box = { version = "0.9", features = ["seal"] }
# Phase 30 hybrid sealing (keyd::hybrid, ADR-014): both already in the tree (russh uses them)
curve25519-dalek = "5.0"
ml-kem = { version = "0.3", features = ["hazmat"] }
libc = "0.2"
rand = "0.8"
recovery-key = { path = "../recovery-key" }
zeroize = "1"
zstd = "0.14"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
