[package]
name = "nftsync"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "nexus-nft-sync: fills the appliance firewall's outbound allow-list sets (root oneshot)"

[[bin]]
name = "nexus-nft-sync"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
