[package]
name = "chunkstore-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "AGPL-3.0-only"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
chunkstore = { path = ".." }
postcard = { version = "1", features = ["use-std"] }

[workspace]
members = ["."]

[[bin]]
name = "sealed_open"
path = "fuzz_targets/sealed_open.rs"
test = false
doc = false
bench = false

[[bin]]
name = "meta_decode"
path = "fuzz_targets/meta_decode.rs"
test = false
doc = false
bench = false
