[package]
name = "agent-linux"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "NexusBackup Linux agent (nexus-agent): pull-model file backup over mTLS"

[[bin]]
name = "nexus-agent"
path = "src/main.rs"

[lib]
name = "nexus_agent"
path = "src/lib.rs"

[dependencies]
tls-pq = { path = "../tls-pq" }
agent-core = { path = "../agent-core" }
agent-proto = { path = "../agent-proto" }
agent-ui-proto = { path = "../agent-ui-proto" }
libc = "0.2"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# interop test against the real appliance side (tests/interop.rs)
agent-conn = { path = "../agent-conn" }
base64 = "0.22"
blake3 = "1"
chunkstore = { path = "../chunkstore" }
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring", "x509-parser"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tempfile = "3"

[lints]
workspace = true
