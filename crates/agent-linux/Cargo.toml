[package]
name = "agent-linux"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "NexusBackup Linux agent (nexus-agent): pull-model file backup over mTLS"

[[bin]]
name = "nexus-agent"
path = "src/main.rs"

[lib]
name = "nexus_agent"
path = "src/lib.rs"

[dependencies]
agent-proto = { path = "../agent-proto" }
base64 = "0.22"
blake3 = "1"
fastcdc = "3"
hex = "0.4"
libc = "0.2"
postcard = { version = "1", features = ["use-std"] }
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
x509-parser = { version = "0.16", features = ["verify"] }

[dev-dependencies]
# interop test against the real appliance side (tests/interop.rs)
agent-conn = { path = "../agent-conn" }
chunkstore = { path = "../chunkstore" }
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring", "x509-parser"] }
tempfile = "3"
