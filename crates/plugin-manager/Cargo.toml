[package]
name = "plugin-manager"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Plugin lifecycle: upload verification (web-api), catalog rows, installer nexus-plugin-install"

[dependencies]
anyhow = "1"
catalog = { path = "../catalog" }
plugin-proto = { path = "../plugin-proto", features = ["bundle"] }
serde_json = "1"

[[bin]]
name = "nexus-plugin-install"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
