[package]
name = "agent-windows"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "NexusBackup Windows agent (nexus-agent.exe): VSS + USN journal file backup over mTLS"

[[bin]]
name = "nexus-agent"
path = "src/main.rs"

[lib]
name = "nexus_agent_windows"
path = "src/lib.rs"

[dependencies]
agent-core = { path = "../agent-core" }
agent-proto = { path = "../agent-proto" }
blake3 = "1"

[target.'cfg(windows)'.dependencies]
windows-core = "0.62"
windows-service = "0.8"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Vss",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
]

[dev-dependencies]
tempfile = "3"
