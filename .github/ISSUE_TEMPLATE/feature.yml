name: Feature request
description: A capability that is missing or could work better.
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what stops you today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How it could work. Mention other products that solve it, if you know one.
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Scale, security or compliance constraints, alternatives considered.
