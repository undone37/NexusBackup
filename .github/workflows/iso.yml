name: iso
# Installer ISO for a released image: bootc-image-builder (anaconda-iso) around the image digest of a
# release, attached to that GitHub release with its SHA256SUMS. Runs after the release workflow, or by hand
# for an existing release: gh workflow run iso.yml -f tag=v0.0.1-alpha
on:
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: release tag (vX.Y.Z[-pre])
        required: true

permissions:
  contents: write # upload the ISO to the release
  packages: read # pull the (private) image

jobs:
  iso:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: self-hosted
    env:
      TAG: ${{ inputs.tag || github.event.workflow_run.head_branch }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BIB: quay.io/centos-bootc/bootc-image-builder:latest
    steps:
      # the ISO config comes from the workflow's own commit (older tags predate release/iso/)
      - name: Runner tools
        # the self-hosted runner brings these (docs/release.md "Runner"); fail before a long build
        run: |
          missing=; for t in git gh jq podman; do command -v "$t" >/dev/null || missing="$missing $t"; done
          [ -z "$missing" ] || { echo "::error::runner lacks:$missing (docs/release.md, Runner)"; exit 1; }
      - uses: actions/checkout@v7

      - name: Image digest of the release
        run: |
          [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "bad tag $TAG"; exit 1; }
          gh release download "$TAG" -p release-metadata.json
          img=$(jq -er .image release-metadata.json)
          [[ $img =~ ^ghcr\.io/[a-z0-9/_.-]+@sha256:[0-9a-f]{64}$ ]] || { echo "bad image $img"; exit 1; }
          echo "IMAGE=$img" >> "$GITHUB_ENV"
          echo "ISO=nexusbackup-${TAG#v}-x86_64.iso" >> "$GITHUB_ENV"


      - name: Pull
        run: |
          echo "$GH_TOKEN" | sudo podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          sudo podman pull "$IMAGE"
          sudo podman pull "$BIB"

      - name: Build the ISO
        run: |
          mkdir out
          sudo podman run --rm --privileged --security-opt label=type:unconfined_t \
            -v "$PWD/release/iso/config.toml:/config.toml:ro" -v "$PWD/out:/output" \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            "$BIB" --type anaconda-iso --rootfs xfs --use-librepo=false "$IMAGE"
          sudo find out -name '*.iso' -exec mv {} "$ISO" \;
          sudo chown "$USER" "$ISO"
          ls -l "$ISO"
          # GitHub release assets are limited to 2 GiB
          [ "$(stat -c %s "$ISO")" -lt 2147483648 ] || { echo "ISO larger than 2 GiB"; exit 1; }
          sha256sum "$ISO" > "$ISO.sha256"

      - name: Attach to the release
        run: gh release upload "$TAG" "$ISO" "$ISO.sha256" --clobber

  # bare-metal recovery ISO (docs/bmr.md), built from the release's own sources
  rescue:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: self-hosted
    env:
      TAG: ${{ inputs.tag || github.event.workflow_run.head_branch }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check the tag
        run: '[[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "bad tag $TAG"; exit 1; }'
      - name: Runner tools
        # the self-hosted runner brings these (docs/release.md "Runner"); fail before a long build
        run: |
          missing=; for t in git gh jq podman; do command -v "$t" >/dev/null || missing="$missing $t"; done
          [ -z "$missing" ] || { echo "::error::runner lacks:$missing (docs/release.md, Runner)"; exit 1; }
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - name: Build and attach the rescue ISO
        run: |
          [ -x restore-vm/rescue/build.sh ] || { echo "$TAG predates the rescue ISO"; exit 0; }
          restore-vm/rescue/build.sh
          cd target/rescue
          iso=$(ls nexus-rescue-*.iso)
          sha256sum "$iso" > "$iso.sha256"
          cp manifest.txt rescue-manifest.txt
          gh release upload "$TAG" "$iso" "$iso.sha256" rescue-manifest.txt --clobber

  # every file the maintainer signs and publishes, before the draft is handed over
  assets:
    needs: [iso, rescue]
    runs-on: self-hosted
    env:
      TAG: ${{ inputs.tag || github.event.workflow_run.head_branch }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: All release assets attached
        run: |
          v=${TAG#v}
          have=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          missing=0
          for want in "nexusbackup-$v-x86_64.iso" "nexusbackup-$v-x86_64.iso.sha256" 'nexus-rescue-.*\.iso' \
                      sbom.spdx.json release-metadata.json cve-report.txt SHA256SUMS \
                      'nexus-agent_.*_amd64\.deb' 'nexus-agent_.*_arm64\.deb' 'nexus-agent-.*\.x86_64\.rpm' \
                      'nexus-agent-.*\.aarch64\.rpm' 'nexus-agent-.*-x64\.msi' 'nexus-agent-release-.*\.tar'; do
            if grep -Eqx -- "$want" <<<"$have"; then echo "ok       $want"; else echo "MISSING  $want"; missing=1; fi
          done
          {
            echo "### $TAG assets"
            echo '```'; echo "$have"; echo '```'
            [ $missing = 0 ] && echo "Complete: ready for release/sign.sh (docs/release.md)." || echo "**Assets missing**, see the job log."
          } >> "$GITHUB_STEP_SUMMARY"
          exit $missing

