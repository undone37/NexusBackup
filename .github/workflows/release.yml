name: release
# Tag v* -> build the bootc appliance image, push it to ghcr.io, attach an SBOM, and
# open a DRAFT GitHub release with the digest; then a grype CVE scan (fails on critical CVEs with a
# fix, report attached) and the agent packages (.deb/.rpm/.msi). CI does NOT sign: the release key is
# offline. The release manager signs the printed digest with release/sign.sh, checks
# it with release/verify.sh and moves the channel tag with release/promote.sh
# (docs/release.md).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # draft release with SBOM + metadata
  packages: write # push to ghcr.io

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # The Containerfile and its build context (see os/README.md).
  CONTAINERFILE: os/Containerfile
  # repo root: the image builds the Rust workspace, the web UI and the restore micro-VM
  BUILD_CONTEXT: .

jobs:
  image:
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      image: ${{ steps.push.outputs.image }}
    steps:
      # the hosted runner's disk: drop preinstalled SDKs nothing here uses (about 30 GB)
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      # Ubuntu 24.04 forbids unprivileged user namespaces (AppArmor); rootless podman needs them
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 } # release notes: the commits since the previous tag

      - name: Release constants
        run: grep -E '^[A-Z_][A-Z0-9_]*=' release/config.env >> "$GITHUB_ENV"

      - name: Tag must be a version
        run: |
          [[ $GITHUB_REF_NAME =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] ||
            { echo "tag $GITHUB_REF_NAME is not vX.Y.Z[-pre]"; exit 1; }
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Unit tests (update agent, health check)
        run: python3 -m unittest discover -s os/greenboot/tests -v

      - name: Pin the release public key(s), drop the TEST key
        run: release/inject-keys.sh

      # Phase 27: the image ships the newest signed agent release (os/agent-release ->
      # /usr/share/nexus/agent). CI cannot sign: the release manager signs the tree of the
      # packages job offline (release/sign.sh sign-agent-release) and attaches
      # nexus-agent-release-<v>-signed.tar to this release (or an earlier one). Without it
      # the image ships no agent release (agents are then updated with uploads).
      - name: Signed agent release for the image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p out/agent-release
          for from in "$GITHUB_REF_NAME" ""; do
            gh release download $from --pattern 'nexus-agent-release-*-signed.tar' --dir out/agent-release --clobber 2>/dev/null && break
          done
          shopt -s nullglob
          tars=(out/agent-release/nexus-agent-release-*-signed.tar)
          if [ ${#tars[@]} -eq 0 ]; then
            echo "::warning::no signed agent release attached: the image ships none (docs/agent-update-plan.md)"
            exit 0
          fi
          tar -C out/agent-release -xf "${tars[-1]}"
          for d in out/agent-release/*/; do
            release/verify.sh --agent-release "$d"
            cp -a "$d" os/agent-release/
          done

      - name: Build
        run: |
          podman build --pull=always \
            --build-arg NEXUS_VERSION="$VERSION" \
            --build-arg NEXUS_IMAGE_REPO="$NEXUS_IMAGE_REPO" \
            --label org.opencontainers.image.version="$VERSION" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            --label org.opencontainers.image.source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            -f "$CONTAINERFILE" -t localhost/nexus-os:release "$BUILD_CONTEXT"

      # layers from the final file tree: files removed from base layers are really gone (the installer ISO must
      # stay below 2 GiB) and content-based chunks keep updates small; everything below checks and ships it
      - name: Rechunk
        run: |
          release/rechunk.sh localhost/nexus-os:release localhost/nexus-os:release-chunked
          podman tag localhost/nexus-os:release-chunked localhost/nexus-os:release

      - name: bootc container lint
        run: podman run --rm localhost/nexus-os:release bootc container lint

      - name: The image trusts exactly the release key(s)
        run: |
          img=localhost/nexus-os:release
          podman run --rm "$img" cat /etc/containers/policy.json | diff - os/etc/containers/policy.json
          for k in release/keys/*.pub; do
            podman run --rm "$img" cat "/etc/pki/nexus/cosign/$(basename "$k")" | diff - "$k"
          done
          if podman run --rm "$img" grep -rl "NEXUS TEST KEY" /etc /usr/etc 2>/dev/null; then
            echo "TEST key in the release image"; exit 1
          fi
          podman run --rm "$img" sh -c 'systemctl is-enabled nexus-update.timer greenboot-healthcheck.service &&
            test "$(systemctl is-enabled bootc-fetch-apply-updates.timer)" = masked'

      - name: CIS report and gate (OpenSCAP)
        # a throw-away container of the image evaluates the CIS server L1 profile; fails when a rule of
        # release/cis-passing.txt no longer passes (Phase 35d)
        run: release/cis-report.sh localhost/nexus-os:release out/cis

      - uses: actions/upload-artifact@v7
        if: always()
        continue-on-error: true
        with:
          name: cis-report
          path: out/cis/
          if-no-files-found: ignore

      - name: Push (version tag only; appliances follow the channel tag set by promote.sh)
        id: push
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          podman push --digestfile digest localhost/nexus-os:release "docker://$NEXUS_IMAGE_REPO:$GITHUB_REF_NAME"
          d=$(cat digest)
          [[ $d =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$d" >> "$GITHUB_OUTPUT"
          echo "image=$NEXUS_IMAGE_REPO@$d" >> "$GITHUB_OUTPUT"
          echo "IMAGE_REF=$NEXUS_IMAGE_REPO@$d" >> "$GITHUB_ENV"

      - name: Edge proxy image (docs/edge.md; its ISO comes from iso.yml)
        run: |
          img=localhost/nexus-edge-os:release
          podman build --pull=always --build-arg NEXUS_VERSION="$VERSION" --build-arg RELEASE_KEYS=release/keys \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            --label org.opencontainers.image.source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            -f os/edge/Containerfile -t "$img" .
          podman run --rm "$img" bootc container lint
          if podman run --rm "$img" grep -rl "NEXUS TEST KEY" /etc 2>/dev/null; then
            echo "TEST key in the edge image"; exit 1
          fi
          podman push --digestfile edge-digest "$img" "docker://$NEXUS_IMAGE_REPO-edge:$GITHUB_REF_NAME"
          d=$(cat edge-digest)
          [[ $d =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "EDGE_REF=$NEXUS_IMAGE_REPO-edge@$d" >> "$GITHUB_ENV"

      - name: SBOM (syft) and metadata
        # label=disable: on an SELinux host unlabeled bind mounts are refused (as release/lib.sh)
        run: |
          mkdir -p out
          podman run --rm --user 0 --security-opt label=disable -v "$PWD/out:/out" \
            -e SYFT_REGISTRY_AUTH_AUTHORITY=ghcr.io \
            -e SYFT_REGISTRY_AUTH_USERNAME="${{ github.actor }}" \
            -e SYFT_REGISTRY_AUTH_PASSWORD="${{ secrets.GITHUB_TOKEN }}" \
            "$SYFT_IMAGE" scan "registry:$IMAGE_REF" -o spdx-json=/out/sbom.spdx.json
          base=$(podman image inspect --format '{{.Digest}}' "$POLICY_CHECK_IMAGE" 2>/dev/null || true)
          jq -n --arg v "$VERSION" --arg tag "$GITHUB_REF_NAME" --arg img "$IMAGE_REF" --arg edge "$EDGE_REF" \
            --arg commit "$GITHUB_SHA" --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg base "quay.io/almalinuxorg/almalinux-bootc:10@$base" \
            --arg keys "$(cd release/keys && sha256sum -- *.pub)" \
            '{version: $v, tag: $tag, image: $img, edge_image: $edge, git_commit: $commit, workflow_run: $run,
              base_image: $base, pinned_keys_sha256: ($keys | split("\n")),
              signed: false, sign_with: "release/sign.sh sign \($img)"}' > out/release-metadata.json
          cat out/release-metadata.json

      - name: Attach SBOM to the image (OCI referrer)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman run --rm -i --user 0 --security-opt label=disable -v "$PWD/out:/out:ro" -w /out \
            "$ORAS_IMAGE" attach --username "${{ github.actor }}" --password-stdin \
            --artifact-type application/spdx+json "$IMAGE_REF" sbom.spdx.json:application/spdx+json

      - name: Draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > notes.md <<EOF
          Image: \`$IMAGE_REF\`

          **Not signed yet.** Appliances reject this image until the release manager runs, with the offline key:

          \`\`\`sh
          export COSIGN_KEY=/path/to/the-release.key   # the offline release key (not in the repository)
          release/sign.sh sign $IMAGE_REF      # or the air-gapped payload/sign-payload/attach steps
          git worktree add --detach ../rel $GITHUB_REF_NAME && cd ../rel && release/inject-keys.sh   # pin the release key, as the image does
          release/verify.sh --policy $IMAGE_REF
          release/promote.sh $IMAGE_REF stable
          \`\`\`

          Agent packages (.deb/.rpm/.msi + SHA256SUMS, attached by the \`packages\` job): sign them offline too:

          \`\`\`sh
          gh release download $GITHUB_REF_NAME -D pkgs -p '*.deb' -p '*.rpm' -p '*.msi' -p SHA256SUMS
          release/sign.sh sign-blobs pkgs && release/verify.sh --blobs pkgs
          gh release upload $GITHUB_REF_NAME pkgs/*.sig
          \`\`\`

          Offline update bundle (after \`sign.sh sign\`: it carries that signature, nothing is signed again):

          \`\`\`sh
          release/update-bundle.sh nexusbackup-$VERSION-update.tar --image $IMAGE_REF
          gh release upload $GITHUB_REF_NAME nexusbackup-$VERSION-update.tar
          \`\`\`

          Then publish this draft. See docs/release.md.

          The installer ISO and the rescue ISO follow from the iso workflow; its \`assets\` job checks that every
          file of the release is attached.
          EOF
          # hand-written notes for this tag (breaking changes, highlights) go first
          if [ -f "release/notes/$GITHUB_REF_NAME.md" ]; then
            { cat "release/notes/$GITHUB_REF_NAME.md"; echo; echo '---'; echo; cat notes.md; } > notes.new && mv notes.new notes.md
          fi
          prev=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          {
            echo
            echo "## Changes since ${prev:-the first commit}"
            echo
            # subjects only, long ones cut (the body of a release is limited to 125,000 characters)
            git log --no-merges --format='- %s' ${prev:+"$prev.."}"$GITHUB_REF_NAME" | cut -c1-160 | head -c 100000
          } >> notes.md
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "$GITHUB_REF_NAME" \
            --notes-file notes.md out/sbom.spdx.json out/release-metadata.json
          {
            echo "### $GITHUB_REF_NAME built, NOT signed"
            echo
            echo "\`$IMAGE_REF\`"
            echo
            echo "Next: \`release/sign.sh sign $IMAGE_REF\` (offline key), \`release/verify.sh --policy\`, \`release/promote.sh\`."
          } >> "$GITHUB_STEP_SUMMARY"

  cve:
    # grype CVE scan of the pushed image (release/cve-scan.sh: pinned grype image run in podman,
    # vulnerability DB cached in the podman volume nexus-grype-db; nothing installed on the runner).
    # The report (table + JSON) is uploaded as an artifact and attached to the draft release;
    # a critical CVE with a fixed package version fails the job (rebuild: --pull=always takes the fix).
    needs: image
    runs-on: ubuntu-24.04
    steps:
      # the hosted runner's disk: drop preinstalled SDKs nothing here uses (about 30 GB)
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      # Ubuntu 24.04 forbids unprivileged user namespaces (AppArmor); rootless podman needs them
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: actions/checkout@v7

      - name: Scan
        id: scan
        continue-on-error: true
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          release/cve-scan.sh "registry:${{ needs.image.outputs.image }}" out

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cve-report
          path: out/grype*

      - name: Attach the report to the draft release
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp out/grype.txt out/cve-report.txt
          cp out/grype.json out/cve-report.json
          gh release upload "$GITHUB_REF_NAME" out/cve-report.txt out/cve-report.json --clobber
          {
            echo "### CVE scan (grype)"
            echo
            if [ -s out/grype-blocking.txt ]; then
              echo "Critical CVEs with a fix available (rebuild the release):"
              echo '```'; cat out/grype-blocking.txt; echo '```'
            else
              echo "No critical CVE with a fix available. Full table: cve-report.txt on the release."
            fi
            if [ -s out/grype-excepted.txt ]; then
              echo
              echo "Covered by reviewed exceptions (release/cve-exceptions.json):"
              echo '```'; cat out/grype-excepted.txt; echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # final releases: a critical CVE with a fix available fails; pre-releases (vX.Y.Z-alpha, -beta, ...)
      # only report it (maintainer decision 2026-10-15: fixes that only AlmaLinux / Debian can ship must not
      # block alphas); a scan that did not complete fails both
      - name: No critical CVE with a fix available
        if: steps.scan.outcome != 'success'
        run: |
          if [ ! -s out/grype-blocking.txt ]; then echo "the scan did not complete"; exit 1; fi
          cat out/grype-blocking.txt
          if [[ $GITHUB_REF_NAME == *-* ]]; then
            echo "::warning::pre-release $GITHUB_REF_NAME: critical CVEs with a fix available are reported, not blocking"
            exit 0
          fi
          exit 1

  packages:
    # Agent packages next to the image: nexus-agent and nexus-agent-desktop .deb/.rpm
    # (x86_64 + aarch64) and the Windows MSI (agent + desktop UI), built and checked in rootless podman containers (release/packages.sh,
    # release/test-packages.sh; nothing is installed on the runner), uploaded to the draft
    # release with SHA256SUMS. Not signed: the release manager runs release/sign.sh sign-blobs.
    needs: image
    runs-on: ubuntu-24.04
    steps:
      # the hosted runner's disk: drop preinstalled SDKs nothing here uses (about 30 GB)
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      # Ubuntu 24.04 forbids unprivileged user namespaces (AppArmor); rootless podman needs them
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: actions/checkout@v7

      - name: Build (release keys from release/keys)
        run: release/packages.sh

      - name: Check (install on debian:13 / almalinux:10 / fedora, lintian, rpmlint, MSI tables)
        run: release/test-packages.sh

      - name: Attach to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd target/packages
          gh release upload "$GITHUB_REF_NAME" ./*.deb ./*.rpm ./*.msi SHA256SUMS ./nexus-agent-release-*.tar --clobber
          {
            echo "### Agent packages (NOT signed)"
            echo
            echo '```'
            cat SHA256SUMS
            echo '```'
            echo
            echo "Next: \`release/sign.sh sign-blobs\` (offline key), \`release/verify.sh --blobs\`, upload the .sig files."
            echo "Agent release for the appliance image: unpack nexus-agent-release-*.tar, \`release/sign.sh sign-agent-release <dir>\`,"
            echo "\`release/verify.sh --agent-release <dir>\`, attach nexus-agent-release-<v>-signed.tar (next image build ships it)."
          } >> "$GITHUB_STEP_SUMMARY"
