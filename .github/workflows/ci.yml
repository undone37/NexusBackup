name: ci
on: [push, pull_request]
# a newer push to the same branch makes the older run pointless
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust:
    runs-on: self-hosted
    env:
      # the workspace's test build no longer fits a runner's disk with full debug info
      # (PostgreSQL / Keycloak testboxes then failed with "No space left on device")
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy, rustfmt" }
      - run: command -v qemu-img >/dev/null || { if command -v dnf >/dev/null; then sudo dnf install -y qemu-img; else sudo apt-get update && sudo apt-get install -y qemu-utils; fi; }
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      # Ubuntu 24.04 runners forbid unprivileged user namespaces (AppArmor); the plugin
      # sandbox tests start real sandboxes (the appliance allows them, docs/plugin-system.md)
      - run: |
          f=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if [ -e "$f" ] && [ "$(cat "$f")" != 0 ]; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
      - run: cargo test --all --no-fail-fast
      - if: always()
        run: df -h / && du -sh target
      - run: perl -MJSON -e1 2>/dev/null || { if command -v dnf >/dev/null; then sudo dnf install -y perl-JSON; else sudo apt-get update && sudo apt-get install -y libjson-perl; fi; }
      - run: prove pve-plugin/t
      - run: python3 -m unittest discover -s os/greenboot/tests
      - run: release/check-trust.sh
  web:
    # the SPA embedded in nexus-web-api (same Node major as os/Containerfile)
    runs-on: self-hosted
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm run build
  agent-windows:
    # Windows agent: cross-compile in podman (rust + mingw-w64), clippy for the Windows
    # target, size/import checks; platform-independent unit tests on Linux.
    # No Windows runner on purpose (docs/agent-windows.md "Untested").
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p agent-core -p agent-windows
      - run: crates/agent-windows/build.sh --test-key --clippy
      - uses: actions/upload-artifact@v7
        with:
          name: nexus-agent-windows
          path: target/agent-dist/windows/
      # desktop UI (crates/agent-gui): Windows + Linux x86_64 builds, clippy for Windows
      - run: crates/agent-gui/build.sh --no-arm64 --clippy
  audit:
    runs-on: self-hosted
    # audit-check reports through a check run
    permissions: { contents: read, checks: write }
    steps:
      - uses: actions/checkout@v7
      # the self-hosted runner has no preinstalled cargo (GitHub-hosted runners do)
      - uses: dtolnay/rust-toolchain@stable
      - uses: rustsec/audit-check@v2
        with: { token: "${{ secrets.GITHUB_TOKEN }}" }
