# Weekly update PRs, grouped per ecosystem so the single self-hosted runner gets one CI run each; at night
# (Europe/Berlin) so their CI runs do not queue in front of work on main (maintainer decision 2026-10-20).
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly, day: monday, time: "02:00", timezone: Europe/Berlin }
    open-pull-requests-limit: 3
    groups:
      cargo-minor: { update-types: [minor, patch] }
    ignore:
      # windows-core must be the version the windows crate is built on (vss.rs mixes their GUID, HRESULT and
      # BSTR types); windows 0.62 uses windows-core 0.62. Bump both together when windows moves (PR #11)
      - dependency-name: windows-core
        update-types: [version-update:semver-major, version-update:semver-minor]
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly, day: monday, time: "02:00", timezone: Europe/Berlin }
    open-pull-requests-limit: 3
    groups:
      npm-minor: { update-types: [minor, patch] }
    ignore:
      # svelte-check 4.7 accepts only TypeScript 5 or 6 (peer dependency); drop when it supports 7
      - dependency-name: typescript
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly, time: "03:00", timezone: Europe/Berlin }
    groups:
      actions: { patterns: ["*"] }
