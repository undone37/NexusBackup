# Weekly update PRs, grouped per ecosystem so the single self-hosted runner gets one CI run each.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    groups:
      cargo-minor: { update-types: [minor, patch] }
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    groups:
      npm-minor: { update-types: [minor, patch] }
    ignore:
      # svelte-check 4.7 accepts only TypeScript 5 or 6 (peer dependency); drop when it supports 7
      - dependency-name: typescript
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions: { patterns: ["*"] }
