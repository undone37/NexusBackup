[package]
name = "oracle"
version = "1.0.3"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "NexusBackup plugin: Oracle Database through RMAN over SSH (level 0/1, archived logs, point-in-time restore)"

[dependencies]
anyhow = "1"
plugin-sdk = { path = "../../crates/plugin-sdk" }
russh = { version = "0.65", default-features = false, features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "net"] }

[lints]
workspace = true
