[package]
name = "postgresql"
version = "1.4.3"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "NexusBackup reference plugin: PostgreSQL logical dumps, base backup + WAL, point-in-time restore"

[dependencies]
anyhow = "1"
base64 = "0.22"
getrandom = "0.2"
hmac = "0.12"
md5 = { package = "md-5", version = "0.10" }
plugin-sdk = { path = "../../crates/plugin-sdk" }
russh = { version = "0.64", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = { version = "0.4", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "time", "net"] }
webpki-roots = "1"

[dev-dependencies]
plugin-sdk = { path = "../../crates/plugin-sdk", features = ["testing"] }
tempfile = "3"

[lints]
workspace = true
