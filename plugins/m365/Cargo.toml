[package]
name = "m365-plugin"
version = "1.2.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "NexusBackup plugin: Microsoft 365 (Exchange, OneDrive, SharePoint, Teams, Groups) via Microsoft Graph (docs/m365.md)"

[lib]
name = "m365_plugin"

[[bin]]
name = "m365-plugin"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
pem = "3"
plugin-sdk = { path = "../../crates/plugin-sdk" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
ring = "0.17"
serde_json = "1"

[dev-dependencies]
chunkstore = { path = "../../crates/chunkstore" }
plugin-sdk = { path = "../../crates/plugin-sdk", features = ["testing"] }
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tempfile = "3"
