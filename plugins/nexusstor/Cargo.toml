[package]
name = "nexusstor-plugin"
version = "1.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "NexusBackup plugin: vStors of a paired NexusStor (docs/nexusstor-design.md)"

[features]
# the plugin (TLS client, backup); without it only the pairing token parser (web-api)
default = ["client"]
client = ["dep:chunkstore", "dep:pem", "dep:plugin-sdk", "dep:rustls", "dep:sha2", "dep:tls-pq", "dep:truenas"]

[dependencies]
anyhow = "1"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chunkstore = { path = "../../crates/chunkstore", optional = true }
pem = { version = "4", optional = true }
plugin-sdk = { path = "../../crates/plugin-sdk", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"], optional = true }
sha2 = { version = "0.10", optional = true }
tls-pq = { path = "../../crates/tls-pq", optional = true }
truenas = { path = "../../crates/truenas", default-features = false, features = ["client"], optional = true }

[[bin]]
name = "nexusstor-plugin"
path = "src/main.rs"
required-features = ["client"]

[dev-dependencies]
plugin-sdk = { path = "../../crates/plugin-sdk", features = ["testing"] }
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring"] }
tempfile = "3"

[lints]
workspace = true
