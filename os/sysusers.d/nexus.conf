# Static system users for NexusBackup services (plan.md 4.2: one user per service).
# Locked accounts, no shell, no home.
g nexus-keyd       -
u nexus-keyd       -:nexus-keyd "NexusBackup key daemon"           -  /usr/sbin/nologin
# runs nexus-scheduler and the jobs it spawns (nexus-pve, nexus-offsite, restore micro-VM)
u nexus-chunkstore -            "NexusBackup scheduler/chunk store" -  /usr/sbin/nologin
u nexus-webapi     -            "NexusBackup web UI/API"           -  /usr/sbin/nologin
# The scheduler may connect to the keyd socket (group nexus-keyd); nobody else may.
m nexus-chunkstore nexus-keyd
# Catalog DB (/var/lib/nexus/catalog, setgid dir) and downloads: web-api writes
# intent, the scheduler executes jobs (docs/control-plane.md).
g nexus-catalog    -
m nexus-webapi     nexus-catalog
m nexus-chunkstore nexus-catalog
# Replication (docs/replication.md): nexus-replicad runs as nexus-chunkstore with
# primary group nexus-replicad; only the web-api may reach its runtime dir.
g nexus-replicad   -
m nexus-webapi     nexus-replicad
# File search (docs/file-index-v2-plan.md): nexus-index has its own uid (#51); keyd hands
# it keyrings read-only; the web-api and the scheduler reach its runtime dir through the group.
u nexus-index      -            "NexusBackup file search index"  -  /usr/sbin/nologin
m nexus-chunkstore nexus-index
m nexus-index      nexus-chunkstore
m nexus-index      nexus-keyd
m nexus-webapi     nexus-index
# Plugin installer (docs/plugin-system.md): its own user, neither root nor the plugin
# runtime uid; catalog access (group nexus-catalog). The web-api writes uploads into
# the staging dir (group nexus-plugins, setgid).
g nexus-plugins    -
u nexus-plugins    -:nexus-plugins "NexusBackup plugin installer"  -  /usr/sbin/nologin
m nexus-plugins    nexus-catalog
m nexus-webapi     nexus-plugins
# The restore micro-VM opens /dev/kvm (udev: GROUP=kvm, MODE=0666 on EL; kept
# explicit in case the mode is tightened).
m nexus-chunkstore kvm
