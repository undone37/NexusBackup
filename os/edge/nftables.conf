#!/usr/sbin/nft -f
# NexusBackup edge proxy firewall (Phase 26, docs/edge.md).
#
# Inbound:  443/tcp (agents, from anywhere) and 7445/tcp (the appliance's control link,
#           from control_v4/control_v6, filled by /etc/nexus-edge/control-sources.nft: any address by
#           default, nexus-edge-setup can restrict it); loopback,
#           established/related, ICMP errors/echo, IPv6 neighbour discovery, DHCP replies.
# Outbound: the edge never dials anything except DNS, NTP/NTS and DHCP; replies to the
#           connections above are established traffic.
# nexus-edge applies its own per-IP / per-certificate rate limits after accept; the
# meter below only caps SYN floods per source address.

flush ruleset

table inet edge {
	set control_v4 { type ipv4_addr; flags interval; auto-merge; }
	set control_v6 { type ipv6_addr; flags interval; auto-merge; }

	chain input {
		type filter hook input priority filter; policy drop;
		iif lo accept
		ct state established,related accept
		ct state invalid drop
		meta l4proto icmp icmp type { echo-request, destination-unreachable, time-exceeded, parameter-problem } limit rate 10/second accept
		meta l4proto ipv6-icmp icmpv6 type { echo-request, destination-unreachable, packet-too-big, time-exceeded, parameter-problem, nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert } accept
		udp sport 67 udp dport 68 accept
		udp sport 547 udp dport 546 accept
		tcp dport 443 ct state new meter edge_syn_v4 { ip saddr limit rate over 20/second burst 40 packets } drop
		tcp dport 443 ct state new meter edge_syn_v6 { ip6 saddr limit rate over 20/second burst 40 packets } drop
		tcp dport 443 accept
		tcp dport 7445 ip saddr @control_v4 accept
		tcp dport 7445 ip6 saddr @control_v6 accept
	}

	chain forward {
		type filter hook forward priority filter; policy drop;
	}

	chain output {
		type filter hook output priority filter; policy drop;
		oif lo accept
		ct state established,related accept
		meta l4proto { icmp, ipv6-icmp } accept
		udp dport 53 accept
		tcp dport 53 accept
		udp dport 123 accept
		tcp dport 4460 accept
		udp dport { 67, 547 } accept
	}
}

include "/etc/nexus-edge/control-sources.nft"
