#!/usr/sbin/nft -f
# NexusBackup appliance firewall (plan.md 12.1, 12.4; ADR-003 pull model).
#
# Inbound:  default deny; only the services below from their source sets (in_<service>_*),
#           loopback, established/related, IPv6 neighbour discovery, DHCP client replies.
# Outbound: default deny; only destinations in the allow-list sets below.
#
# The sets are empty in the image. They are populated at runtime by the control plane
# (generated when sources/offsite targets are configured, and by first boot for DNS/NTS),
# e.g.: nft add element inet nexus allowed_out_v4 '{ 192.0.2.10 . tcp . 8006 }'

flush ruleset

table inet nexus {
	# Sources (PVE 8006/22, agents, NFS/SMB, TrueNAS) and offsite targets (Storage Box SFTP 23).
	set allowed_out_v4 {
		type ipv4_addr . inet_proto . inet_service
		comment "generated: source + offsite targets"
	}
	set allowed_out_v6 {
		type ipv6_addr . inet_proto . inet_service
		comment "generated: source + offsite targets"
	}

	# Configured resolvers (53/udp+tcp) and NTS servers (NTS-KE 4460/tcp, NTP 123/udp).
	set dns_servers_v4 { type ipv4_addr; comment "configured DNS resolvers"; }
	set dns_servers_v6 { type ipv6_addr; comment "configured DNS resolvers"; }
	set nts_servers_v4 { type ipv4_addr; comment "resolved NTS servers"; }
	set nts_servers_v6 { type ipv6_addr; comment "resolved NTS servers"; }

	# Inbound rules per service (Settings -> Firewall, setting inbound; Phase 16c): who may open
	# connections. Filled by nexus-nft-sync: enabled with an empty source list = any address
	# (0.0.0.0/0, ::/0), a list = those CIDRs, disabled = empty. The image starts with the
	# defaults (web from any address, ping off). Console reset: nexus-setup reset-firewall.
	# web: 8443/tcp = web UI, REST API, /metrics and replication (one TLS port; nftables cannot
	# tell them apart, so they are restricted together).
	set in_web_v4 {
		type ipv4_addr; flags interval; auto-merge
		elements = { 0.0.0.0/0 }
		comment "generated: inbound web sources"
	}
	set in_web_v6 {
		type ipv6_addr; flags interval; auto-merge
		elements = { ::/0 }
		comment "generated: inbound web sources"
	}
	# icmp: echo requests (ping)
	set in_icmp_v4 {
		type ipv4_addr; flags interval; auto-merge
		comment "generated: inbound ping sources"
	}
	set in_icmp_v6 {
		type ipv6_addr; flags interval; auto-merge
		comment "generated: inbound ping sources"
	}

	# Recent blocked inbound attempts (source . protocol . port), for Settings -> Firewall:
	# every dropped unicast TCP/UDP packet refreshes its element (24 h timeout, packet counter);
	# nexus-nft-sync --status reads them. Bounded: a full set records nothing new.
	set in_drops_v4 {
		type ipv4_addr . inet_proto . inet_service
		size 256
		flags dynamic, timeout
		timeout 1d
		counter
		comment "recent blocked inbound attempts"
	}
	set in_drops_v6 {
		type ipv6_addr . inet_proto . inet_service
		size 256
		flags dynamic, timeout
		timeout 1d
		counter
		comment "recent blocked inbound attempts"
	}

	chain input {
		type filter hook input priority filter; policy drop;

		iif "lo" accept
		ct state invalid drop
		ct state established,related accept

		# IPv6 neighbour discovery is required for IPv6 to work at all.
		meta l4proto ipv6-icmp icmpv6 type { nd-neighbor-solicit, nd-neighbor-advert, nd-router-advert } ip6 hoplimit 255 accept

		# DHCP client replies (management interface may be DHCP-configured).
		udp sport 67 udp dport 68 accept
		udp sport 547 udp dport 546 accept

		# services
		ip  saddr @in_web_v4 tcp dport 8443 ct state new accept
		ip6 saddr @in_web_v6 tcp dport 8443 ct state new accept
		ip  saddr @in_icmp_v4 icmp type echo-request limit rate 10/second accept
		ip6 saddr @in_icmp_v6 icmpv6 type echo-request limit rate 10/second accept

		# everything else is dropped: recorded, and logged rate-limited
		meta pkttype host meta nfproto ipv4 meta l4proto { tcp, udp } update @in_drops_v4 { ip saddr . meta l4proto . th dport }
		meta pkttype host meta nfproto ipv6 meta l4proto { tcp, udp } update @in_drops_v6 { ip6 saddr . meta l4proto . th dport }
		limit rate 10/minute log prefix "nexus-in-drop: " level info
	}

	chain forward {
		type filter hook forward priority filter; policy drop;
	}

	chain output {
		type filter hook output priority filter; policy drop;

		oif "lo" accept
		ct state invalid drop
		ct state established,related accept

		meta l4proto ipv6-icmp icmpv6 type { nd-neighbor-solicit, nd-neighbor-advert, nd-router-solicit } accept

		udp sport 68 udp dport 67 accept
		udp sport 546 udp dport 547 accept

		ip  daddr @dns_servers_v4 meta l4proto { tcp, udp } th dport 53 accept
		ip6 daddr @dns_servers_v6 meta l4proto { tcp, udp } th dport 53 accept
		ip  daddr @nts_servers_v4 tcp dport 4460 accept
		ip6 daddr @nts_servers_v6 tcp dport 4460 accept
		ip  daddr @nts_servers_v4 udp dport 123 accept
		ip6 daddr @nts_servers_v6 udp dport 123 accept

		ip  daddr . meta l4proto . th dport @allowed_out_v4 accept
		ip6 daddr . meta l4proto . th dport @allowed_out_v6 accept

		limit rate 10/minute log prefix "nexus-out-drop: " level info
		reject with icmpx admin-prohibited
	}
}
