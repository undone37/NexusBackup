# #145: the AlmaLinux 10.2 base ships bootupd's bootloader-update.service (`bootupctl update` on every boot).
# On a BIOS-booted appliance it fails ("opening EFI dir: No such file or directory": the image's bootupd
# state names an EFI component, the disk has no ESP), and diagnostics then report a failed unit. Only where
# the firmware booted through EFI. Whether a UEFI appliance should update its boot loader on every boot,
# or only together with an image update, is open (#145).
[Unit]
ConditionPathExists=/sys/firmware/efi
