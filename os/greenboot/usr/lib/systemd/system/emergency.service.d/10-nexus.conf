# Phase 18: emergency mode never opens a shell without a password. root is locked
# (usermod -L, os/Containerfile), and sulogin starts a shell for a locked root only with
# --force, which systemd-sulogin-shell adds when SYSTEMD_SULOGIN_FORCE=1 is in its
# environment (e.g. systemd.setenv= on the kernel command line, which the GRUB password
# protects too). The unit's own value wins over the manager's environment. sulogin then
# refuses and the boot continues. rescue.target / rescue.service are masked.
[Service]
Environment=SYSTEMD_SULOGIN_FORCE=0
