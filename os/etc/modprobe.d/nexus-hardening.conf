# Kernel modules the appliance never needs (plan.md Phase 35, docs/cis.md): rare network protocols and
# file systems. Guest file systems are parsed in user space (nexus-fsindex) and restored by the micro-VM's
# own kernel, never mounted here. USB storage stays: offline update bundles and the hardware page use it.
install atm /bin/false
blacklist atm
install can /bin/false
blacklist can
install dccp /bin/false
blacklist dccp
install rds /bin/false
blacklist rds
install sctp /bin/false
blacklist sctp
install tipc /bin/false
blacklist tipc
install firewire-core /bin/false
blacklist firewire-core
install cramfs /bin/false
blacklist cramfs
install freevxfs /bin/false
blacklist freevxfs
install hfs /bin/false
blacklist hfs
install hfsplus /bin/false
blacklist hfsplus
install jffs2 /bin/false
blacklist jffs2
