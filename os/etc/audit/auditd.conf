#
# NexusBackup auditd configuration (#143, from NexusStor's issue #6). The audit trail of SELinux denials,
# logins and the watched files (rules.d/50-nexus.rules) on an appliance whose /var also holds the catalog,
# the journal and the update staging. Keys left out keep auditd's defaults; there is no remote logging
# listener (no tcp_listen_port) and no mail (no MTA): warnings go to the journal. Off-box copies of the
# appliance's own audit log go through Settings, Forwarding; this file is the OS-level trail.
#
local_events = yes
write_logs = yes
log_file = /var/log/audit/audit.log
log_group = root
# ENRICHED: uid, syscall and SELinux names resolved when written, readable in a support bundle without the
# box's /etc/passwd
log_format = ENRICHED
flush = INCREMENTAL_ASYNC
freq = 50
priority_boost = 4
name_format = NONE
q_depth = 2000
overflow_action = SYSLOG
max_restarts = 10
plugin_dir = /etc/audit/plugins.d
end_of_event_timeout = 2
# At most 5 x 8 MB = 40 MB in /var/log/audit (audit.log and audit.log.1-4), rotated by auditd itself
max_log_file = 8
num_logs = 5
max_log_file_action = ROTATE
# Free space on /var (MB). Backups keep running when /var runs low: auditd warns in the journal, then stops
# writing (SUSPEND) with 50 MB left for the catalog, the journal and the update staging. Never HALT or SINGLE
# (the CIS defaults): a full /var must not stop backups and restores. Resume after freeing space:
# `auditctl --signal resume` (systemctl refuses to stop or restart auditd: RefuseManualStop) or reboot.
space_left = 75
space_left_action = SYSLOG
verify_email = no
action_mail_acct = root
admin_space_left = 50
admin_space_left_action = SUSPEND
disk_full_action = SUSPEND
disk_error_action = SYSLOG
