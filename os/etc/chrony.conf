# NexusBackup appliance time sync (plan.md 12.1, threat model T3).
# Only authenticated NTS sources; unauthenticated NTP is never used.
# The resolved addresses of these servers must be in the nftables sets
# nts_servers_v4/v6 (NTS-KE 4460/tcp, NTP 123/udp).

server time.cloudflare.com iburst nts
server ptbtime1.ptb.de     iburst nts
server ptbtime2.ptb.de     iburst nts
server nts.netnod.se       iburst nts

# Refuse any source that is not NTS-authenticated.
authselectmode require
# Require agreement of at least two sources before adjusting the clock.
minsources 2

# Keep NTS cookies/keys across restarts.
ntsdumpdir /var/lib/chrony

driftfile /var/lib/chrony/drift
# Step only during the first updates after boot; slew afterwards.
makestep 1.0 3
rtcsync

# Never act as a server, no remote command port.
port 0
cmdport 0

leapseclist /usr/share/zoneinfo/leap-seconds.list
logdir /var/log/chrony
