# NexusBackup appliance time sync (plan.md 12.1, threat model T3).

# The time servers, authselectmode and minsources: /etc/nexus/time/chrony.conf, written by
# nexus-time (Settings > Time, docs/control-plane.md "Time servers"). NTS sources only unless an
# administrator allows plain NTP servers there (then authenticated sources are preferred). The image
# ships time.cloudflare.com, ptbtime1/2.ptb.de and nts.netnod.se. nexus-nft-sync resolves the
# servers into the nftables sets nts_servers_v4/v6.
include /etc/nexus/time/*.conf

# Keep NTS cookies/keys across restarts.
ntsdumpdir /var/lib/chrony

driftfile /var/lib/chrony/drift
# Step only during the first updates after boot; slew afterwards.
makestep 1.0 3
rtcsync

# Never act as a server, no remote command port.
port 0
cmdport 0

leapseclist /usr/share/zoneinfo/leap-seconds.list
logdir /var/log/chrony
