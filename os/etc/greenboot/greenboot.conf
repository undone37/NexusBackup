# greenboot (greenboot-rs, AlmaLinux 10 AppStream). Our required check:
# /usr/lib/greenboot/check/required.d/50-nexus-health.sh -> /usr/libexec/nexus/nexus-health
#
# A red boot of a freshly updated deployment reboots; GRUB counts the attempts
# (boot_counter in /boot/grub2/grubenv, 08_greenboot.cfg) and after this many red
# boots greenboot runs `bootc rollback` and reboots into the previous image.
GREENBOOT_MAX_BOOT_ATTEMPTS=3

# greenboot-default-health-checks is not installed (its DNS check would fail behind
# the default-deny firewall); nothing to disable.
DISABLED_HEALTHCHECKS=()
