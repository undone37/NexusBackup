# Control directory of nexus-diag: nexus-web-api writes request.json, root writes the
# results (<id>/status.json, checks.json, bundle.tar.gz; 0640) that the web-api serves.
# setgid keeps the group on new files and result dirs. nexus-diag prunes results after 24 h.
d /var/lib/nexus/diag 2770 root nexus-webapi -
