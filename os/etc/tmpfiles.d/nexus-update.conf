# Control directory of nexus-update: web-api and scheduler (group nexus-catalog) write
# request/window/inhibit, root writes status.json. setgid keeps the group on new files.
d /var/lib/nexus/update 2770 root nexus-catalog -
# Offline updates: the verified bundle's OCI layout, root only (policy.json accepts this path for the oci
# transport; nexus-update moves the upload here and checks the signature before bootc reads it).
d /var/lib/nexus/update-offline 0700 root root -
