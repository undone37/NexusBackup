# Control directory of nexus-net (docs/control-plane.md "Network interfaces"): nexus-web-api
# writes req-<id>.json and confirm.json (group), root writes status.json, ops.json and
# config.json 0644 for the scheduler (interface-bound egress, `network.op` audit) and nexus-diag
# (path-MTU check), which only need to traverse it (o+x, no listing).
d /var/lib/nexus/net 2771 root nexus-webapi -
