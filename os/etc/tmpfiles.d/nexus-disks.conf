# Control directory of nexus-disks (docs/hardware.md): nexus-web-api writes req-<id>.json
# (group), root writes status.json and ops.json 0644 for the scheduler (`disk` alerts,
# `hardware.op` audit), which only needs to traverse it (o+x, no listing).
d /var/lib/nexus/disks 2771 root nexus-webapi -
