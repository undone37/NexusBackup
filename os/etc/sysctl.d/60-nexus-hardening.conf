# Kernel and network hardening (plan.md Phase 35, docs/cis.md: the CIS AlmaLinux OS 10 server L1 rules
# these implement are listed there). The appliance routes nothing, answers no redirects and keeps kernel
# addresses and logs from unprivileged users.

# not a router (the restore micro-VM has no NIC, the edge proxy is its own image)
net.ipv4.ip_forward = 0
net.ipv4.conf.all.forwarding = 0
net.ipv4.conf.default.forwarding = 0
net.ipv6.conf.all.forwarding = 0
net.ipv6.conf.default.forwarding = 0

# no redirects, no source routing
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0

# router advertisements: NetworkManager handles IPv6 autoconfiguration itself (in user space)
net.ipv6.conf.all.accept_ra = 0
net.ipv6.conf.default.accept_ra = 0

# reverse path filter: loose (2), not strict (1, CIS): with role interfaces (Settings > Network) an
# asymmetric route would make strict filtering drop the appliance's own traffic (docs/cis.md deviation)
net.ipv4.conf.all.rp_filter = 2
net.ipv4.conf.default.rp_filter = 2

net.ipv4.conf.all.log_martians = 1
net.ipv4.conf.default.log_martians = 1
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1
net.ipv4.tcp_syncookies = 1

# kernel: pointers and the log buffer for root only, ptrace only of descendants, full ASLR
kernel.kptr_restrict = 1
kernel.dmesg_restrict = 1
kernel.yama.ptrace_scope = 1
kernel.randomize_va_space = 2
fs.protected_hardlinks = 1
fs.protected_symlinks = 1
# no core dumps of setuid programs (and none at all: coredump.conf.d, limits.d)
fs.suid_dumpable = 0
