# NexusBackup OS update agent (/usr/libexec/nexus/nexus-update, docs/release.md).
# KEY=VALUE, no shell expansion.

# Image the appliance follows: <repo>:<tag>. The repo must be the scope of the
# sigstoreSigned rule in /etc/containers/policy.json (everything else is rejected).
# Changed at build time by the Containerfile build arg NEXUS_IMAGE_REPO.
NEXUS_IMAGE_REPO=ghcr.io/nexusbackup/appliance
NEXUS_UPDATE_TAG=stable

# Default maintenance window, UTC: "<days> HH:MM <minutes>", days = daily | Mon,Tue,...
# or "off" (never reboot automatically; only an admin "apply" request does).
# The control plane can override it in /var/lib/nexus/update/window.
NEXUS_UPDATE_WINDOW=Sun 03:00 120

# How often to look for (and download) a new image.
NEXUS_UPDATE_CHECK_HOURS=24

# Outbound is default-deny. "nft": while fetching, the registry hosts' addresses are
# added to the nexus allowed_out sets (443/tcp) and removed afterwards. "none": the
# firewall already allows them (e.g. through a proxy rule).
NEXUS_UPDATE_EGRESS=nft
NEXUS_UPDATE_HOSTS=ghcr.io pkg-containers.githubusercontent.com
