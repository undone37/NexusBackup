# sshd is not enabled on the appliance (the console gate is the only root shell). Should anyone enable it,
# it starts hardened (plan.md Phase 35, docs/cis.md): no root, no passwords that are empty, no host-based
# or rhosts logins, nobody allowed until a group is named here, short timeouts, a banner.
PermitRootLogin no
PermitEmptyPasswords no
HostbasedAuthentication no
IgnoreRhosts yes
PermitUserEnvironment no
AllowGroups nexus-ssh
MaxAuthTries 4
MaxSessions 10
MaxStartups 10:30:60
LoginGraceTime 60
ClientAliveInterval 15
ClientAliveCountMax 3
LogLevel VERBOSE
Banner /etc/issue.net
