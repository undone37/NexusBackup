# NexusBackup state, config and runtime directories (docs/control-plane.md).
# Created at boot by systemd-tmpfiles with these owners and modes (and labelled
# from the SELinux file contexts); the units only get ReadWritePaths= on them.
#
# Type Path                          Mode  User              Group            Age
d /var/lib/nexus                     0755  root              root             -
# SQLite catalog (WAL): setgid so -wal/-shm keep the group; web-api + scheduler + setup
d /var/lib/nexus/catalog             2770  root              nexus-catalog    -
# file-restore downloads: written by the scheduler, read by web-api (group)
d /var/lib/nexus/downloads           2750  nexus-chunkstore  nexus-catalog    -
# KEK + wrapped tenant DEKs: keyd only (setup writes it once as root)
d /var/lib/nexus/keyd                0700  nexus-keyd        nexus-keyd       -
# chunk stores, one 0700 subdirectory per tenant (created by the scheduler)
d /var/lib/nexus/chunkstore          0700  nexus-chunkstore  nexus-chunkstore -
d /var/lib/nexus/offsite             0700  nexus-chunkstore  nexus-chunkstore -
d /var/lib/nexus/escrow              0700  nexus-chunkstore  nexus-chunkstore -
d /var/lib/nexus/scheduler           0700  nexus-chunkstore  nexus-chunkstore -
# nexus-replicad: replication CA + token-sealing key (docs/replication.md)
d /var/lib/nexus/replicad            0700  nexus-chunkstore  nexus-chunkstore -
# plugins (docs/plugin-system.md): installed tree, written only by nexus-plugin-install
# (versions: dirs 0555, files 0444); uploads from the web-api, read + deleted by the installer
d /var/lib/nexus/plugins             0755  nexus-plugins     nexus-plugins    -
d /var/lib/nexus/plugins-staging     2770  nexus-webapi      nexus-plugins    -
# console unlock codes (hashes only): written by the web-api, read + deleted by the
# console gate (root) on tty2
d /var/lib/nexus/console-unlock      0700  nexus-webapi      nexus-webapi     -
# configuration backup (nexus-config-backup): request.json from the scheduler, the sealed
# latest.bundle + status for the scheduler (upload) and the web-api (download); setgid
d /var/lib/nexus/config-backup       2770  root              nexus-catalog    -
# web certificate requests: written by the web-api (group), answered by nexus-tls (root)
d /var/lib/nexus/tls                 0770  root              nexus-webapi     -
# setup output: tls/ (key 0600 nexus-webapi), metrics-token; ssh/ holds the
# appliance's keys and known_hosts for the PVE nodes: the scheduler generates,
# rotates and retires its own keys there (pve, offsite; docs/phase12-contract.md §4)
d /etc/nexus                         0755  root              root             -
d /etc/nexus/ssh                     0750  nexus-chunkstore  nexus-chunkstore -
# outbound allow-list written by the scheduler for nexus-nft-sync (root)
d /run/nexus-nft                     0755  nexus-chunkstore  nexus-chunkstore -
# effective firewall state + recent blocked inbound attempts (nexus-nft-sync writes, web-api reads)
d /run/nexus-nft-status              0755  root              root             -
