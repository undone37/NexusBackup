[package]
name = "restorevm-agent"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "PID 1 of the restore micro-VM: mounts guest file systems read-only and serves them over virtio-serial"

[[bin]]
name = "nexus-restore-agent"
path = "src/main.rs"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = { version = "0.4", default-features = false }

[lints]
workspace = true
